<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#14532d" />
        <title>Offline · Fish Farm ERP</title>

        <!--
        Offline fallback page.
        Self-contained on purpose: no external CSS/JS so it renders even when
        nothing else is cached. Served by public/sw.js for failed navigations.
    -->
        <style>
            :root {
                --primary-dark: #14532d;
                --secondary-dark: #115e59;
                --background: #f1f5f4;
                --text: #0f172a;
                --muted: #64748b;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 1.5rem;
                background: var(--background);
                color: var(--text);
                font-family:
                    "Inter",
                    "Hind Siliguri",
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                line-height: 1.6;
            }

            .card {
                width: 100%;
                max-width: 28rem;
                background: #fff;
                border: 1px solid #e2e8f0;
                border-radius: 0.875rem;
                box-shadow:
                    0 1px 2px rgb(15 23 42 / 0.04),
                    0 4px 12px rgb(15 23 42 / 0.06);
                padding: 2rem 1.75rem;
                text-align: center;
            }

            .badge {
                width: 3.5rem;
                height: 3.5rem;
                margin: 0 auto 1.25rem;
                border-radius: 0.75rem;
                display: grid;
                place-items: center;
                color: #fff;
                font-weight: 700;
                font-size: 1.125rem;
                background-image: linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--secondary-dark)
                );
            }

            h1 {
                margin: 0 0 0.5rem;
                font-size: 1.375rem;
            }

            p {
                margin: 0 0 1rem;
                color: var(--muted);
                font-size: 0.9375rem;
            }

            ul {
                text-align: left;
                margin: 0 0 1.5rem;
                padding-left: 1.15rem;
                color: var(--muted);
                font-size: 0.875rem;
            }

            li {
                margin-bottom: 0.35rem;
            }

            button {
                appearance: none;
                border: 0;
                cursor: pointer;
                padding: 0.6rem 1.25rem;
                border-radius: 0.5rem;
                color: #fff;
                font-size: 0.875rem;
                font-weight: 600;
                background-image: linear-gradient(
                    120deg,
                    var(--primary-dark),
                    #15803d 55%,
                    #0f766e
                );
            }

            button:hover {
                opacity: 0.95;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="badge">F</div>

            <h1>You are offline</h1>
            <p>
                The Fish Farm ERP needs a server connection to load and save
                farm data.
            </p>

            <ul>
                <li>Pages you already visited may still be viewable.</li>
                <li>
                    Changes <strong>cannot</strong> be saved until you
                    reconnect.
                </li>
                <li>Nothing you entered now has been stored.</li>
            </ul>

            <button type="button" onclick="window.location.reload()">
                Try again
            </button>
        </div>

        <script>
            // Auto-reload as soon as the connection returns.
            window.addEventListener("online", () => window.location.reload());
        </script>
    </body>
</html>
